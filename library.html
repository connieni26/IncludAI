<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Library — Transition Translator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-left">
      <div class="nav-logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.5 2a2.5 2.5 0 0 0-2.5 2.5v.5a2.5 2.5 0 0 0-2.5 2.5c0 .6.2 1.2.5 1.6A2.5 2.5 0 0 0 2 11.5 2.5 2.5 0 0 0 4.5 14a2.5 2.5 0 0 0 2 4.4A2.5 2.5 0 0 0 9 21a2.5 2.5 0 0 0 2.5-2.5v-14A2.5 2.5 0 0 0 9.5 2Z"/><path d="M14.5 2a2.5 2.5 0 0 1 2.5 2.5v.5a2.5 2.5 0 0 1 2.5 2.5c0 .6-.2 1.2-.5 1.6a2.5 2.5 0 0 1 1 3.4A2.5 2.5 0 0 1 19.5 16a2.5 2.5 0 0 1-2 3.4A2.5 2.5 0 0 1 15 21a2.5 2.5 0 0 1-2.5-2.5v-14A2.5 2.5 0 0 1 14.5 2Z"/></svg>
      </div>
      <span>Transition Translator</span>
    </div>
    <div class="nav-links">
      <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Home</a>
      <a href="profiles.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Profiles</a>
      <a href="generate.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Studio</a>
      <a href="library.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>Library</a>
    </div>
  </nav>

  <main class="page">
    <h1 style="font-size: 1.6rem; margin-bottom: 4px;">Saved Scripts</h1>
    <p style="color: var(--text-muted); margin-top: 0;">Revisit and rehearse transitions you've already generated.</p>

    <div id="scriptList" style="margin-top: 24px;"></div>
  </main>

  <script src="app-data.js"></script>
  <script>
    function render() {
      const list = document.getElementById("scriptList");
      const scripts = AppData.getScripts();

      if (scripts.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            No saved scripts yet. <a href="generate.html" style="color: var(--accent); font-weight: 600;">Generate one →</a>
          </div>`;
        return;
      }

      list.innerHTML = scripts
        .map(
          (s) => `
        <div class="list-item" style="align-items: flex-start; flex-direction: column;">
          <div style="display:flex; justify-content: space-between; width: 100%;">
            <div>
              <h4>${escapeHtml(s.currentActivity)} → ${escapeHtml(s.nextActivity)}</h4>
              <div class="meta">${escapeHtml(s.profileName)} · ${AppData.timeAgo(s.createdAt)}</div>
            </div>
            <button class="btn-secondary" onclick="removeScript('${s.id}')">Delete</button>
          </div>
          <p style="margin: 12px 0 0; white-space: pre-wrap;">${escapeHtml(s.script)}</p>
        </div>`
        )
        .join("");
    }

    function removeScript(id) {
      if (confirm("Delete this saved script?")) {
        AppData.deleteScript(id);
        render();
      }
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    render();
  </script>
</body>
</html>
